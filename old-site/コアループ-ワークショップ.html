<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, follow"/>
  <meta http-equiv="refresh" content="8; url=https://digitaldemocracy2030.github.io/dd2030-wiki/%E3%82%B3%E3%82%A2%E3%83%AB%E3%83%BC%E3%83%97-%E3%83%AF%E3%83%BC%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%83%E3%83%97"/>
  <title>dd2030 Wiki は移動しました</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #172026;
      background: #f6f7f8;
      display: grid;
      place-items: center;
      line-height: 1.75;
    }
    main {
      width: min(720px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      padding: clamp(24px, 5vw, 48px);
      box-shadow: 0 16px 40px rgba(23, 32, 38, 0.08);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      line-height: 1.25;
      letter-spacing: 0;
    }
    p { margin: 0 0 16px; }
    a { color: #075a9c; overflow-wrap: anywhere; }
    .small { color: #52616b; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>dd2030 Wiki は移動しました</h1>
    <p>このページは digitaldemocracy2030 org の新しいWikiに移動しました。旧URLは告知用に残しています。</p>
    <p>新しいページ: <a id="target-link" href="https://digitaldemocracy2030.github.io/dd2030-wiki/%E3%82%B3%E3%82%A2%E3%83%AB%E3%83%BC%E3%83%97-%E3%83%AF%E3%83%BC%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%83%E3%83%97">https://digitaldemocracy2030.github.io/dd2030-wiki/%E3%82%B3%E3%82%A2%E3%83%AB%E3%83%BC%E3%83%97-%E3%83%AF%E3%83%BC%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%83%E3%83%97</a></p>
    <p class="small">8秒後に自動で新しいURLへ移動します。</p>
  </main>
  <script>
    (() => {
      const target = new URL('https://digitaldemocracy2030.github.io/dd2030-wiki/%E3%82%B3%E3%82%A2%E3%83%AB%E3%83%BC%E3%83%97-%E3%83%AF%E3%83%BC%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%83%E3%83%97');
      target.search = location.search;
      target.hash = location.hash;
      const href = target.href;

      const link = document.getElementById('target-link');
      link.href = href;
      link.textContent = decodeURI(href);
      window.setTimeout(() => location.replace(href), 8000);
    })();
  </script>
</body>
</html>
